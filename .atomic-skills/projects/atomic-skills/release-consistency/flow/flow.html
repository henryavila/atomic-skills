/*
 * Atomic Skills product docs — shared design-system tokens.
 * Extracted from docs/design/project-onboarding/index.html (aiDeck foundations).

/* ─────────────────────────────────────────────────────────────────────
   aiDeck Design System — Foundations (v2)
   Dark default. Light is a second palette on the same token names.

   Tokens are intentionally domain-agnostic — `status-success` not
   `phase-done`, `chart-1..8` not `verifier-shell`.
   ───────────────────────────────────────────────────────────────────── */

/* Fonts — Inter (sans) + JetBrains Mono (identifiers). System stacks fall
   back when webfonts are unavailable (offline-friendly). */

:root {
  color-scheme: dark;

  /* ── Surfaces ───────────────────────────────────────────────── */
  --bg-sunken:      #07090d;   /* inputs, code blocks, deepest wells */
  --bg-canvas:      #0a0d12;   /* page background */
  --bg-surface:     #12161d;   /* widget cards, section panels */
  --bg-elevated:    #1a1f28;   /* hover, popovers, dropdowns */
  --bg-overlay:     #232936;   /* selected rows, focus halos */
  --bg-highlight:   #2d3340;   /* highest — used sparingly */

  /* ── Glass ──────────────────────────────────────────────────── */
  --glass-thin:     rgba(18, 22, 29, 0.55);
  --glass-medium:   rgba(18, 22, 29, 0.72);
  --glass-thick:    rgba(10, 13, 18, 0.85);
  --glass-border:   rgba(255, 255, 255, 0.06);
  --glass-blur:     saturate(180%) blur(20px);
  --glass-blur-sm:  saturate(160%) blur(10px);

  /* ── Borders ────────────────────────────────────────────────── */
  --border-subtle:  #1a2029;
  --border-default: #262d38;
  --border-strong:  #3d4656;
  --border-bright:  #555f72;

  /* ── Foreground ─────────────────────────────────────────────── */
  --fg-default:     #e9eef5;   /* primary text — body, headings */
  --fg-muted:       #98a1ad;   /* secondary — captions, labels */
  --fg-subtle:      #6b7585;   /* tertiary — metadata */
  --fg-faint:       #424a5a;   /* lowest — disabled */
  --fg-on-accent:   #08090d;   /* text on saturated chip fill */

  /* ── Semantic status ────────────────────────────────────────── */
  --status-success: #4cc28e;   /* emerald   — passed, done, healthy */
  --status-warning: #e0a44a;   /* amber     — needs attention, blocked */
  --status-error:   #ff5c5c;   /* coral red — failed, critical, broken */
  --status-info:    #5fb1ff;   /* azure     — active, running, current */
  --status-neutral: #8b95a3;   /* slate     — idle, pending, unknown */

  --status-success-bg: color-mix(in srgb, var(--status-success) 14%, var(--bg-surface));
  --status-warning-bg: color-mix(in srgb, var(--status-warning) 14%, var(--bg-surface));
  --status-error-bg:   color-mix(in srgb, var(--status-error)   16%, var(--bg-surface));
  --status-info-bg:    color-mix(in srgb, var(--status-info)    14%, var(--bg-surface));
  --status-neutral-bg: var(--bg-elevated);

  --status-success-line: color-mix(in srgb, var(--status-success) 42%, var(--border-default));
  --status-warning-line: color-mix(in srgb, var(--status-warning) 42%, var(--border-default));
  --status-error-line:   color-mix(in srgb, var(--status-error)   48%, var(--border-default));
  --status-info-line:    color-mix(in srgb, var(--status-info)    42%, var(--border-default));
  --status-neutral-line: var(--border-default);

  /* ── Accents ────────────────────────────────────────────────── */
  --accent-primary: var(--status-info);
  --accent-focus:   #88c4ff;
  --accent-link:    #88c4ff;

  /* ── Typography stacks ──────────────────────────────────────── */
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system,
               "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono",
               "Menlo", "Consolas", monospace;
  --font-display: var(--font-sans);

  /* ── Type scale ─────────────────────────────────────────────── */
  --fs-2xs: 10px;
  --fs-xs:  11px;
  --fs-sm:  12px;
  --fs-base:13px;
  --fs-md:  14px;
  --fs-lg:  16px;
  --fs-xl:  20px;
  --fs-2xl: 24px;
  --fs-3xl: 32px;
  --fs-4xl: 40px;
  --fs-5xl: 56px;

  --lh-tight:  1.15;
  --lh-snug:   1.35;
  --lh-normal: 1.5;
  --lh-relaxed:1.65;

  --tracking-tight:  -0.015em;
  --tracking-normal: 0;
  --tracking-wide:   0.04em;
  --tracking-wider:  0.08em;

  --fw-regular:  400;
  --fw-medium:   500;
  --fw-semibold: 600;
  --fw-bold:     700;

  /* ── Spacing (4px base) ─────────────────────────────────────── */
  --space-0:  0;
  --space-1:  2px;
  --space-2:  4px;
  --space-3:  6px;
  --space-4:  8px;
  --space-5:  10px;
  --space-6:  12px;
  --space-7:  14px;
  --space-8:  16px;
  --space-10: 20px;
  --space-12: 24px;
  --space-14: 28px;
  --space-16: 32px;
  --space-20: 40px;
  --space-24: 48px;
  --space-32: 64px;

  /* ── Radii ──────────────────────────────────────────────────── */
  --radius-none: 0;
  --radius-xs:   2px;
  --radius-sm:   4px;
  --radius-md:   6px;
  --radius-lg:   8px;
  --radius-xl:   12px;
  --radius-2xl:  16px;
  --radius-pill: 999px;

  --border-width: 1px;

  /* ── Elevation ──────────────────────────────────────────────── */
  --highlight-inset:        inset 0 1px 0 rgba(255, 255, 255, 0.045);
  --highlight-inset-strong: inset 0 1px 0 rgba(255, 255, 255, 0.075);
  --shadow-sm:      0 2px 4px -2px rgba(0, 0, 0, 0.5),
                    var(--highlight-inset);
  --shadow-md:      0 8px 24px -8px rgba(0, 0, 0, 0.6),
                    0 2px 6px -2px rgba(0, 0, 0, 0.4),
                    var(--highlight-inset);
  --shadow-focus:   0 0 0 2px var(--bg-canvas),
                    0 0 0 4px var(--accent-focus);
}

@media (prefers-color-scheme: light) {
  html:not([data-theme="dark"]) {
    color-scheme: light;

    --bg-sunken:      #e8edf4;
    --bg-canvas:      #f4f6fa;
    --bg-surface:     #ffffff;
    --bg-elevated:    #eef2f7;
    --bg-overlay:     #e2e8f0;
    --bg-highlight:   #d8dee8;

    --glass-thin:     rgba(255, 255, 255, 0.55);
    --glass-medium:   rgba(255, 255, 255, 0.78);
    --glass-thick:    rgba(244, 246, 250, 0.9);
    --glass-border:   rgba(15, 23, 42, 0.08);

    --border-subtle:  #e8edf3;
    --border-default: #d5dce6;
    --border-strong:  #b8c2d0;
    --border-bright:  #8b97a8;

    --fg-default:     #12161d;
    --fg-muted:       #4a5565;
    --fg-subtle:      #6b7585;
    --fg-faint:       #98a1ad;
    --fg-on-accent:   #ffffff;

    --accent-focus:   #1565c0;
    --accent-link:    #1565c0;

    --highlight-inset:        inset 0 1px 0 rgba(255, 255, 255, 0.85);
    --highlight-inset-strong: inset 0 1px 0 rgba(255, 255, 255, 0.95);
    --shadow-sm:      0 1px 2px rgba(15, 23, 42, 0.06),
                      0 1px 3px rgba(15, 23, 42, 0.04);
    --shadow-md:      0 8px 24px -8px rgba(15, 23, 42, 0.12),
                      0 2px 6px -2px rgba(15, 23, 42, 0.08);
  }
}

html[data-theme="dark"] {
  color-scheme: dark;
}

html[data-theme="light"] {
  color-scheme: light;

  --bg-sunken:      #e8edf4;
  --bg-canvas:      #f4f6fa;
  --bg-surface:     #ffffff;
  --bg-elevated:    #eef2f7;
  --bg-overlay:     #e2e8f0;
  --bg-highlight:   #d8dee8;

  --glass-thin:     rgba(255, 255, 255, 0.55);
  --glass-medium:   rgba(255, 255, 255, 0.78);
  --glass-thick:    rgba(244, 246, 250, 0.9);
  --glass-border:   rgba(15, 23, 42, 0.08);

  --border-subtle:  #e8edf3;
  --border-default: #d5dce6;
  --border-strong:  #b8c2d0;
  --border-bright:  #8b97a8;

  --fg-default:     #12161d;
  --fg-muted:       #4a5565;
  --fg-subtle:      #6b7585;
  --fg-faint:       #98a1ad;
  --fg-on-accent:   #ffffff;

  --accent-focus:   #1565c0;
  --accent-link:    #1565c0;

  --highlight-inset:        inset 0 1px 0 rgba(255, 255, 255, 0.85);
  --highlight-inset-strong: inset 0 1px 0 rgba(255, 255, 255, 0.95);
  --shadow-sm:      0 1px 2px rgba(15, 23, 42, 0.06),
                    0 1px 3px rgba(15, 23, 42, 0.04);
  --shadow-md:      0 8px 24px -8px rgba(15, 23, 42, 0.12),
                    0 2px 6px -2px rgba(15, 23, 42, 0.08);
}

/* ── Base ─────────────────────────────────────────────────────────── */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg-canvas);
  color: var(--fg-default);
  font-family: var(--font-sans);
  font-size: var(--fs-md);
  line-height: var(--lh-normal);
  -webkit-font-smoothing: antialiased;
}

a {
  color: var(--accent-link);
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

code,
pre,
.mono {
  font-family: var(--font-mono);
  font-feature-settings: "calt" 0;
}

code {
  font-size: 0.92em;
  background: var(--bg-sunken);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 0.1em 0.35em;
}

pre {
  margin: 0;
  padding: var(--space-8);
  background: var(--bg-sunken);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg);
  overflow-x: auto;
  font-size: var(--fs-sm);
  line-height: var(--lh-snug);
}

pre code {
  background: transparent;
  border: 0;
  padding: 0;
  font-size: inherit;
}

/* ── Layout chrome for product docs ───────────────────────────────── */

.site-shell {
  max-width: 960px;
  margin: 0 auto;
  padding: var(--space-12) var(--space-10) var(--space-24);
}

.site-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-8);
  margin-bottom: var(--space-16);
  padding-bottom: var(--space-10);
  border-bottom: 1px solid var(--border-default);
}

.site-brand {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  color: var(--fg-default);
  text-decoration: none;
}

.site-brand:hover {
  text-decoration: none;
}

.site-brand-title {
  font-size: var(--fs-lg);
  font-weight: var(--fw-semibold);
  letter-spacing: var(--tracking-tight);
}

.site-brand-sub {
  font-size: var(--fs-xs);
  color: var(--fg-subtle);
  font-family: var(--font-mono);
}

.site-nav {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.site-nav a {
  display: inline-flex;
  align-items: center;
  height: 30px;
  padding: 0 var(--space-6);
  border-radius: var(--radius-pill);
  border: 1px solid transparent;
  color: var(--fg-muted);
  font-size: var(--fs-sm);
  font-weight: var(--fw-medium);
  text-decoration: none;
}

.site-nav a:hover {
  color: var(--fg-default);
  background: var(--bg-elevated);
  text-decoration: none;
}

.site-nav a.active {
  color: var(--status-info);
  background: var(--status-info-bg);
  border-color: var(--status-info-line);
}

.site-header-tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-6);
}

.theme-switch {
  display: inline-flex;
  align-items: stretch;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-pill);
  background: var(--bg-elevated);
  overflow: hidden;
}

.theme-switch button {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--fg-muted);
  font-family: var(--font-sans);
  font-size: var(--fs-xs);
  font-weight: var(--fw-medium);
  height: 28px;
  padding: 0 var(--space-5);
  cursor: pointer;
}

.theme-switch button[aria-checked="true"] {
  background: var(--bg-surface);
  color: var(--fg-default);
}

.theme-switch button:focus-visible {
  outline: none;
  box-shadow: var(--shadow-focus);
}

.site-main {
  display: flex;
  flex-direction: column;
  gap: var(--space-12);
}

.site-footer {
  margin-top: var(--space-24);
  padding-top: var(--space-10);
  border-top: 1px solid var(--border-default);
  color: var(--fg-subtle);
  font-size: var(--fs-sm);
}

h1, h2, h3 {
  margin: 0;
  line-height: var(--lh-tight);
  letter-spacing: var(--tracking-tight);
  font-weight: var(--fw-semibold);
}

h1 {
  font-size: var(--fs-3xl);
}

h2 {
  font-size: var(--fs-xl);
  margin-top: var(--space-4);
}

h3 {
  font-size: var(--fs-lg);
}

.lede {
  margin: 0;
  color: var(--fg-muted);
  font-size: var(--fs-md);
  line-height: var(--lh-relaxed);
  max-width: 68ch;
}

.section {
  display: flex;
  flex-direction: column;
  gap: var(--space-6);
}

.card {
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-xl);
  padding: var(--space-10) var(--space-12);
  box-shadow: var(--shadow-sm);
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: var(--space-8);
}

.card a.card-title {
  color: var(--fg-default);
  font-weight: var(--fw-semibold);
  text-decoration: none;
}

.card a.card-title:hover {
  color: var(--accent-link);
  text-decoration: underline;
}

.card .one-liner {
  margin: var(--space-4) 0 0;
  color: var(--fg-muted);
  font-size: var(--fs-sm);
  line-height: var(--lh-snug);
}

.iron-law {
  margin-top: var(--space-6);
  padding: var(--space-4) var(--space-6);
  background: color-mix(in srgb, var(--status-warning) 10%, var(--bg-surface));
  border: 1px solid var(--status-warning-line);
  border-radius: var(--radius-md);
  color: var(--status-warning);
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  font-weight: var(--fw-medium);
}

.badge {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 var(--space-5);
  border-radius: var(--radius-pill);
  border: 1px solid transparent;
  font-family: var(--font-mono);
  font-size: var(--fs-2xs);
  font-weight: var(--fw-medium);
  letter-spacing: var(--tracking-wide);
  text-transform: uppercase;
}

.badge-tested {
  background: var(--status-success-bg);
  border-color: var(--status-success-line);
  color: var(--status-success);
}

.badge-theoretical {
  background: var(--status-neutral-bg);
  border-color: var(--status-neutral-line);
  color: var(--fg-muted);
}

.badge-module {
  background: var(--status-info-bg);
  border-color: var(--status-info-line);
  color: var(--status-info);
}

ul.plain {
  margin: 0;
  padding-left: 1.2em;
  color: var(--fg-muted);
}

ul.plain li + li {
  margin-top: var(--space-3);
}

.meta-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-4);
}

.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-xl);
  background: var(--bg-surface);
}

table.docs {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--fs-sm);
}

table.docs th,
table.docs td {
  padding: var(--space-6) var(--space-8);
  text-align: left;
  border-bottom: 1px solid var(--border-subtle);
  vertical-align: top;
}

table.docs th {
  color: var(--fg-subtle);
  font-weight: var(--fw-medium);
  font-size: var(--fs-xs);
  text-transform: uppercase;
  letter-spacing: var(--tracking-wide);
  background: var(--bg-elevated);
}

table.docs tr:last-child td {
  border-bottom: 0;
}

table.docs td {
  color: var(--fg-default);
}

.eyebrow {
  font-size: var(--fs-2xs);
  font-weight: var(--fw-semibold);
  letter-spacing: var(--tracking-wider);
  text-transform: uppercase;
  color: var(--fg-subtle);
}

.install-block {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.back-link {
  font-size: var(--fs-sm);
  color: var(--fg-muted);
}

.prose p {
  margin: 0;
  color: var(--fg-muted);
  max-width: 70ch;
  line-height: var(--lh-relaxed);
}

.prose p + p {
  margin-top: var(--space-6);
}

.list-stack {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  margin: 0;
  padding: 0;
  list-style: none;
}

.list-stack li {
  padding: var(--space-6) var(--space-8);
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg);
}

.list-stack .cmd {
  font-family: var(--font-mono);
  font-size: var(--fs-sm);
  color: var(--status-info);
}

.list-stack .desc {
  margin-top: var(--space-2);
  color: var(--fg-muted);
  font-size: var(--fs-sm);
}

.footnote {
  color: var(--fg-subtle);
  font-size: var(--fs-sm);
  line-height: var(--lh-snug);
  max-width: 70ch;
}

/* ── Project guide spine ────────────────────────────────────────────── */

ol.spine {
  display: flex;
  flex-wrap: wrap;
  align-items: stretch;
  gap: var(--space-4);
  margin: 0;
  padding: 0;
  list-style: none;
}

.spine-step {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-width: 7.5rem;
  max-width: 11rem;
  flex: 1 1 7.5rem;
  padding: var(--space-6) var(--space-6);
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg);
  position: relative;
}

.spine-label {
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
  font-weight: var(--fw-semibold);
  letter-spacing: var(--tracking-wide);
  color: var(--status-info);
}

.spine-note {
  font-size: var(--fs-2xs);
  color: var(--fg-muted);
  line-height: var(--lh-snug);
}

.spine-arrow {
  display: none;
}

.list-stack .cmd-args {
  margin-left: var(--space-2);
  color: var(--fg-subtle);
  font-family: var(--font-mono);
  font-size: var(--fs-xs);
}

    e.preventDefault();
    setScale(scale+(e.deltaY<0?0.1:-0.1));
  },{passive:false});
}
scale=readZoom();
applyStageGeometry();
window.addEventListener("resize",applyStageGeometry);
})();
</script>
