schemaVersion: "0.1"
planSlug: sugestao-necessidade-pdti
actor: GETIN (cria) e líder da área (valida)
scenario: A GETIN propõe uma necessidade de PDTI a qualquer área e o líder adota ou recusa sem operar o Nova.
audience: both
ratifiedAt: "2026-08-12T12:00:00.000Z"
ratifiedBy: overnight-implement-operator-preauth
youAreHere: null
stages:
  - id: necessidade-sugerida
    kind: main
    mapsToPhases: [F0, F1]
    sourcedFrom: design.md decisions 1-3 create path
    copy:
      layperson:
        name: Sugestão criada
        youGain: A GETIN registra a necessidade proposta para a área certa, com dono e histórico.
        unlocks: O líder da área recebe o aviso e pode decidir.
      developer:
        name: Sugestão persistida (origin getin_suggestion)
        youGain: Registro em ItRequestsPdti com status 10, area_id, created_by write-once; Action GETIN + policy createSuggestion.
        unlocks: Notification e CTA para a Livewire de resposta.
  - id: lider-avisado
    kind: main
    mapsToPhases: [F1]
    sourcedFrom: design.md e-mail + CTA
    copy:
      layperson:
        name: Líder avisado
        youGain: O manager da área recebe o conteúdo em texto simples e um botão para validar.
        unlocks: Abrir a página de decisão sem entrar no Nova.
      developer:
        name: E-mail plain + CTA nomeada
        youGain: Notification strip_tags + route pdti.suggestion.respond (auth); filtro Nova 10/11.
        unlocks: Livewire full-page sob middleware auth.
  - id: lider-decide
    kind: main
    mapsToPhases: [F2]
    sourcedFrom: design.md aceite/recusa Livewire
    copy:
      layperson:
        name: Líder decide
        youGain: Ver, ajustar o texto, aceitar (adotar) ou recusar a sugestão em uma tela leve.
        unlocks: Se aceitar, a necessidade segue o fluxo normal; se recusar, a GETIN é avisada.
      developer:
        name: Livewire respondToSuggestion
        youGain: Aceite → status 1 + user_id do manager (origin/created_by intactos); recusa → status 11 + notifica GETIN; monotônico.
        unlocks: Funil GETIN (AcceptOrRefuse) sobre o pedido adotado.
  - id: funil-normal
    kind: main
    mapsToPhases: [F3]
    sourcedFrom: design.md area_id manda no funil
    copy:
      layperson:
        name: Fluxo normal com a área certa
        youGain: Depois do aceite, a análise da GETIN e o restante do PDTI usam a área-alvo da sugestão.
        unlocks: Conversão em necessidade e comitê sem perder o contexto da área.
      developer:
        name: Funil prefere area_id
        youGain: AcceptOrRefuse/Convert/observer/job respeitam area_id e matriz status 10/11 vs funil.
        unlocks: Continuidade do funil existente sem model paralelo.
  - id: fora-escopo
    kind: optional
    sourcedFrom: design outOfScope
    copy:
      layperson:
        name: Fora desta entrega
        youGain: Saber o que não entra agora (app, Filament, comitê extra).
        unlocks: Escopo fechado e previsível.
      developer:
        name: Non-goals
        youGain: Sem Filament, sem validação do líder no Nova, sem multi-manager, sem reabrir 11.
        unlocks: Escopo de implementação estável.
edges:
  - from: necessidade-sugerida
    to: lider-avisado
    style: solid
  - from: lider-avisado
    to: lider-decide
    style: solid
  - from: lider-decide
    to: funil-normal
    style: solid
  - from: lider-decide
    to: fora-escopo
    style: dashed
