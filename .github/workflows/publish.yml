name: Publish to npm (stage)

on:
  release:
    types: [published]

# OIDC Trusted Publishing — no long-lived npm token / NODE_AUTH_TOKEN.
# Preferred model: stage from CI, maintainer approves with 2FA on npm UI.
# See docs/kb/release-npm-stage.md.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Trusted Publishing needs Node ≥ 22.14 and npm ≥ 11.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm test

      # Stage only — do not allow direct `npm publish` on the Trusted Publisher.
      # Maintainer approves with 2FA on the npmjs.com UI (Staged packages) — not CLI.
      - name: Stage package on npm
        run: |
          # Node 22 may ship npm 10; `npm stage` needs ≥ 11.5.1
          npx --yes npm@11.19.1 --version
          NAME="$(node -p 'require("./package.json").name')"
          VERSION="$(node -p 'require("./package.json").version')"
          echo "Staging ${NAME}@${VERSION}"
          npx --yes npm@11.19.1 stage publish --access public
          {
            echo "## Staged ${NAME}@${VERSION}"
            echo ""
            echo "This Release uploaded a **staged** version. It is **not** installable until a maintainer approves with 2FA on the **npm UI**:"
            echo ""
            echo "https://www.npmjs.com/package/${NAME}?activeTab=versions"
            echo ""
            echo "Runbook: docs/kb/release-npm-stage.md"
          } >> "$GITHUB_STEP_SUMMARY"
