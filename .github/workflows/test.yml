name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: node -p "process.version"
      - run: bash scripts/qa.sh setup
      - run: bash scripts/qa.sh full
      - name: Debt may only go down
        if: github.event_name == 'pull_request' && hashFiles('qa/ratchet.py') != ''
        run: |
          if git cat-file -e "origin/${{ github.base_ref }}:qa/ratchet.py" 2>/dev/null; then
            base="$(mktemp -d)" && git archive "origin/${{ github.base_ref }}" qa | tar -x -C "$base"
            python3 -I qa/ratchet.py diff --base "$base/qa" --branch "${{ github.head_ref }}"
          fi
      - run: npm run validate-catalog

  # Windows must execute the installer contract, not only path.win32 helpers.
  windows-path-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: 'npm'
      - run: npm ci
      - run: node -p "process.version"
      - run: node --test tests/windows-installer-platform.test.js tests/multiplatform-contract.test.js tests/antigravity-contract.test.js tests/install-uninstall-roundtrip.test.js

  # Multi-platform install contract: force path-nofollow backend on Linux so
  # /proc/self/fd regressions fail here instead of only on macOS hosts.
  multiplatform-path-nofollow:
    name: multiplatform path-nofollow
    runs-on: ubuntu-latest
    env:
      MINIMALIST_INSTALLER_PATH_BACKEND: path
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: 'npm'
      - run: npm ci
      - name: Record backend + host
        run: node -p "JSON.stringify({node:process.version,platform:process.platform,backend:process.env.MINIMALIST_INSTALLER_PATH_BACKEND})"
      - name: Multiplatform contract + install round-trip under path-nofollow
        run: node --test tests/multiplatform-contract.test.js tests/install-uninstall-roundtrip.test.js tests/installer-data-safety.test.js

  # F6/T-003 — release-blocking Cartesian matrix:
  #   OS ∈ {ubuntu-latest, macos-latest}
  #   Node ∈ {22.18.x, 24.11.x}
  # Windows has a focused native installer + junction job in windows-path-contracts.
  # This broader host-probe matrix stays Unix because several probes require sh.
  # Critical steps never use continue-on-error.
  release-matrix:
    name: release ${{ matrix.os }} node-${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.18', '24.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Record real process.version
        run: node -p "JSON.stringify({node:process.version,platform:process.platform,arch:process.arch})"
      - run: bash scripts/qa.sh setup
      - name: Unit suite
        run: npm test
      - name: Skills + docs
        run: npm run validate-skills && npm run check-docs
      - name: Release blackbox + host probes + fault matrix
        run: node --test tests/release-blackbox.test.js tests/release-host-probes.test.js tests/release-fault-matrix.test.js
      - name: Antigravity contract
        run: node --test tests/antigravity-contract.test.js
      - name: Host probes
        run: node scripts/run-host-probes.js --manifest meta/host-qualification.json --receipt docs/audits/host-contract-receipt.json --write
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-matrix-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            docs/audits/
            **/test-results/
          if-no-files-found: ignore
